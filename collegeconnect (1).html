<style>
/* Layout: app shell. Left module rail on desktop, scrolling tab strip on phones. Main pane holds one module at a time. */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#E9EDF5; --line:#D5DBE8;
  --ink:#121B33; --ink-2:#4A5675; --accent:#2446C8; --accent-ink:#FFFFFF; --mark:#F2B531; --mark-ink:#3A2A00;
  --good:#17803D; --warn:#A96300; --bad:#B42318;
  --pdf:#C23A4B; --f-display:"Bricolage Grotesque",system-ui,sans-serif; --f-body:"Source Sans 3",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1424; --surface:#161E34; --surface-2:#1F2945; --line:#2B3658;
  --ink:#E8ECF7; --ink-2:#A3AECB; --accent:#7C98FF; --accent-ink:#0B1226; --mark:#F2B531; --mark-ink:#3A2A00;
  --good:#52C77D; --warn:#F0B44C; --bad:#FF8A7D; --pdf:#FF7A8A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1424; --surface:#161E34; --surface-2:#1F2945; --line:#2B3658;
  --ink:#E8ECF7; --ink-2:#A3AECB; --accent:#7C98FF; --accent-ink:#0B1226; --mark:#F2B531; --mark-ink:#3A2A00;
  --good:#52C77D; --warn:#F0B44C; --bad:#FF8A7D; --pdf:#FF7A8A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f-body);padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.6rem} h3{font-size:1.1rem}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.02em}
.label{font:500 .72rem/1 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--line);background:var(--surface);padding:.5rem .9rem;border-radius:8px;cursor:pointer;font-weight:600;font-size:.92rem}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:.3rem .65rem;font-size:.82rem}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.55rem .7rem}
textarea{min-height:92px;resize:vertical}
label.f{display:grid;gap:.3rem;font-weight:600;font-size:.88rem}

/* shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));padding:.7rem max(16px,env(safe-area-inset-right,0px)) .7rem max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.6rem;font:700 1.25rem var(--f-display)}
.brand i{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--surface);font-style:normal;font-size:.95rem}
.brand b{color:var(--accent);font-weight:700}
.top .who{margin-left:auto;display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:.35rem;padding:.2rem .6rem;border-radius:99px;background:var(--surface-2);font:500 .74rem var(--f-mono);letter-spacing:.04em;text-transform:uppercase}
.chip.mark{background:var(--mark);color:var(--mark-ink)}
.shell{display:grid;grid-template-columns:210px minmax(0,1fr);gap:1.6rem;max-width:1120px;margin:0 auto;padding-block:1.4rem 3rem}
.rail{display:flex;flex-direction:column;gap:.2rem;position:sticky;top:calc(env(safe-area-inset-top,0px) + 4.4rem);align-self:start}
.rail button{display:flex;justify-content:space-between;align-items:center;gap:.5rem;text-align:left;border:0;background:transparent;padding:.6rem .8rem;border-radius:8px;cursor:pointer;font-weight:600;color:var(--ink-2)}
.rail button:hover{background:var(--surface-2)}
.rail button[aria-current="page"]{background:var(--ink);color:var(--surface)}
.rail .n{font:500 .72rem var(--f-mono);background:var(--mark);color:var(--mark-ink);border-radius:99px;padding:.05rem .45rem}
.main{min-width:0;display:grid;gap:1.2rem;align-content:start}
.head{display:flex;justify-content:space-between;align-items:end;gap:1rem;flex-wrap:wrap}
.head p{color:var(--ink-2);margin-top:.25rem;max-width:60ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1.1rem}
.grid{display:grid;gap:.8rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.muted{color:var(--ink-2)}
.tool{display:grid;grid-template-columns:minmax(0,1fr) 170px 150px;gap:.6rem}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:.8rem}
  .rail{position:static;flex-direction:row;overflow-x:auto;padding-bottom:.3rem}
  .rail button{white-space:nowrap}
  .tool{grid-template-columns:minmax(0,1fr)}
}

/* materials */
.mat{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:.9rem;align-items:center;padding:.8rem 1rem}
.pdf{width:44px;height:54px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:end center;padding-bottom:5px;font:500 .66rem var(--f-mono);color:var(--pdf);position:relative}
.pdf::before{content:"";position:absolute;right:-1px;top:-1px;border:8px solid transparent;border-top-color:var(--bg);border-right-color:var(--bg)}
.mat h3{font-size:1rem;font-family:var(--f-body);font-weight:600;letter-spacing:0}
.mat .meta{color:var(--ink-2);font-size:.86rem;display:flex;gap:.2rem .9rem;flex-wrap:wrap;margin-top:.15rem}
@media (max-width:560px){.mat{grid-template-columns:44px minmax(0,1fr)}.mat .acts{grid-column:1/-1}}
.sheet{border:1px solid var(--accent);background:var(--surface);border-radius:12px;padding:1.1rem;display:grid;gap:.8rem}
.page{background:var(--surface-2);border:1px dashed var(--line);border-radius:8px;padding:1.2rem;display:grid;gap:.5rem}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}.bar>span{display:block;height:100%;background:var(--accent)}

/* announcements */
.ann{display:grid;gap:.45rem;padding:1rem 1.1rem}
.ann.unread{border-left:4px solid var(--mark)}
.ann h3{font-size:1.05rem}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mark);display:inline-block}

/* messages */
.chat{display:grid;grid-template-columns:240px minmax(0,1fr);gap:1rem;min-height:420px}
@media (max-width:760px){.chat{grid-template-columns:minmax(0,1fr)}}
.threads{display:grid;gap:.3rem;align-content:start}
.threads button{display:grid;gap:.1rem;text-align:left;border:1px solid transparent;background:transparent;border-radius:8px;padding:.6rem .7rem;cursor:pointer}
.threads button[aria-current="true"]{background:var(--surface-2);border-color:var(--line)}
.msgs{display:flex;flex-direction:column;gap:.5rem;padding:.4rem 0;max-height:340px;overflow:auto}
.bub{max-width:78%;padding:.5rem .75rem;border-radius:12px;background:var(--surface-2)}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.bub small{display:block;opacity:.7;font:500 .68rem var(--f-mono);margin-top:.15rem}

/* events */
.ev{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:1rem;align-items:center;padding:.8rem 1rem}
.date{text-align:center;border-radius:10px;background:var(--ink);color:var(--surface);padding:.45rem 0}
.date b{display:block;font:700 1.5rem/1 var(--f-display)}.date span{font:500 .68rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase}
@media (max-width:560px){.ev{grid-template-columns:64px minmax(0,1fr)}.ev .acts{grid-column:1/-1}}

/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px}
th{text-align:left;font:500 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
th,td{padding:.55rem .6rem;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:.3rem;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:.55rem .9rem;cursor:pointer;font-weight:600;color:var(--ink-2);border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--mark)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem}
.stat b{font:700 2rem/1 var(--f-display);display:block;margin-top:.4rem}

.pwwrap{position:relative}.pwwrap input{padding-right:4.4rem}
.pwbtn{position:absolute;right:.35rem;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--accent);font-weight:600;font-size:.85rem;cursor:pointer;padding:.35rem .55rem;border-radius:6px}
.pwbtn:hover{background:var(--surface-2)}
/* login */
.login{max-width:900px;margin:0 auto;padding-block:2.2rem 3rem;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:2rem;align-items:start}
@media (max-width:800px){.login{grid-template-columns:minmax(0,1fr)}}
.login h1{font-size:clamp(2rem,6vw,3.2rem)}
.login h1 mark{background:var(--mark);color:var(--mark-ink);padding:0 .2em;border-radius:4px}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.roles button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:.6rem .4rem;cursor:pointer;font-weight:600}
.roles button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.steps{display:grid;gap:.4rem;margin-top:1.2rem}
.steps div{display:flex;gap:.6rem;align-items:center;color:var(--ink-2)}
.err{color:var(--bad);font-weight:600;font-size:.9rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:.65rem 1rem;border-radius:10px;z-index:40;max-width:calc(100% - 32px);font-weight:600}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}
</style>

/* ---------- render + events ---------- */
function render(keepFocus){
  var id=keepFocus&&document.activeElement&&document.activeElement.id,pos=id&&document.activeElement.selectionStart;
  $app.innerHTML=S.user?renderShell():renderLogin();
  Array.prototype.forEach.call($app.querySelectorAll('input[type=password]'),function(i){
    var w=document.createElement('div');w.className='pwwrap';i.parentNode.insertBefore(w,i);w.appendChild(i);
    var b=document.createElement('button');b.type='button';b.className='pwbtn';b.textContent='Show';b.setAttribute('aria-label','Show password');b.setAttribute('aria-pressed','false');
    b.onclick=function(){var s=i.type==='password';i.type=s?'text':'password';b.textContent=s?'Hide':'Show';b.setAttribute('aria-label',s?'Hide password':'Show password');b.setAttribute('aria-pressed',String(s))};
    w.appendChild(b)});
  if(id){var el=document.getElementById(id);if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}}
  var mm=document.getElementById('msgs');if(mm)mm.scrollTop=mm.scrollHeight;
}
function go(v){S.view=v;S.openMat=null;S.annForm=false;S.evForm=false;S.profEdit=false;render();window.scrollTo(0,0)}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act,id=b.dataset.id;
  if(a==='ltab'){S.loginTab=id;S.loginErr='';S.resetFor=null;render()}
  else if(a==='fillDemo'){var ac=S.users.filter(function(u){return u.code===id})[0];S.loginCode=id;S.loginPw=ac?ac.pw:'';S.loginErr='';render()}
  else if(a==='toLogin'){S.created=null;S.loginTab='login';S.loginCode=id;S.loginPw='';S.loginErr='';render()}
  else if(a==='lrole'){S.loginRole=id;S.loginErr='';render()}
  else if(a==='nav'){if(b.dataset.tab)S.adminTab=b.dataset.tab;go(id)}
  else if(a==='logout'){S.user=null;S.loginErr='';S.created=null;S.loginCode='';S.loginPw='';S.loginTab='login';render();toast('You have been logged out')}
  else if(a==='toggleFilter'){S.showFilter=!S.showFilter;render()}
  else if(a==='openMat'){S.openMat=+id;render()}
  else if(a==='closeMat'){S.openMat=null;render()}
  else if(a==='dl')toast('Demo only: this sample material has no file attached')
  else if(a==='annForm'){S.annForm=!S.annForm;render()}
  else if(a==='read'){S.readAnn[id]=true;render()}
  else if(a==='delAnn'){S.anns=S.anns.filter(function(x){return x.id!==+id});render();toast('Announcement deleted')}
  else if(a==='thread'){S.activeThread=+id;render()}
  else if(a==='dirf'){S.dirFilter=id;render()}
  else if(a==='chatWith'){var T=threads(),t=T.filter(function(x){return x.with===id})[0];if(!t){t={id:nid(),with:id,msgs:[]};T.push(t)}S.activeThread=t.id;go('messages')}
  else if(a==='evForm'){S.evForm=!S.evForm;render()}
  else if(a==='delEv'){S.events=S.events.filter(function(x){return x.id!==+id});render();toast('Event removed')}
  else if(a==='profEdit'){S.profEdit=!S.profEdit;render()}
  else if(a==='atab'){S.adminTab=id;S.newCred=null;render()}
  else if(a==='dismissCred'){S.newCred=null;render()}
  else if(a==='toggleUser'){S.users.forEach(function(u){if(u.id===+id)u.on=!u.on});render()}
  else if(a==='delUser'){S.users=S.users.filter(function(u){return u.id!==+id});render();toast('User removed')}
  else if(a==='delSub'){var removed=SUBJECTS.splice(+id,1)[0];S.materials=S.materials.filter(function(m){return m.sub!==removed});render();toast('Subject and its materials removed')}
  else if(a==='delMat'){S.materials=S.materials.filter(function(m){return m.id!==+id});render();toast('Material removed')}
});
document.addEventListener('input',function(e){if(e.target.id==='q'){S.q=e.target.value;render(true)}});
document.addEventListener('change',function(e){var a=e.target.dataset&&e.target.dataset.act;if(a==='fsub'){S.fSub=e.target.value;render()}if(a==='fsem'){S.fSem=e.target.value;render()}});
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
document.addEventListener('submit',function(e){
  var f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();var k=f.dataset.form,d=new FormData(f),g=function(n){return String(d.get(n)||'').trim()};
  if(k==='forgot'){
    var c3=g('code').toUpperCase(),e3=g('email').toLowerCase();S.loginCode=c3;
    var a3=S.users.filter(function(u){return u.code===c3&&u.email.toLowerCase()===e3})[0];
    if(!a3){S.loginErr='No account matches that ID and email.';render();return}
    S.loginErr='';S.resetFor=c3;render();return}
  if(k==='reset'){
    var p1=String(d.get('pw')||''),p2=String(d.get('pw2')||'');
    if(p1!==p2){S.loginErr='The two passwords do not match.';render();return}
    S.users.forEach(function(u){if(u.code===S.resetFor)u.pw=p1});
    var rc=S.resetFor;S.resetFor=null;S.loginErr='';S.loginTab='login';S.loginCode=rc;S.loginPw='';render();toast('Password changed. Log in with your new password');return}
  if(k==='login'){
    var code=g('code').toUpperCase(),pw0=String(d.get('pw')||'');S.loginCode=code;
    var acc=S.users.filter(function(u){return u.code===code})[0];
    S.loginErr='';S.verifying=true;render();
    setTimeout(function(){S.verifying=false;
      if(!acc||acc.pw!==pw0){S.loginErr='ID or password is incorrect.';render();return}
      if(!acc.on){S.loginErr='This account is suspended. Contact the admin office.';render();return}
      S.user={name:acc.name,code:acc.code,email:acc.email,role:acc.role,dept:acc.role==='Faculty'?'Computer Science':'',phone:''};
      S.loginCode='';S.loginPw='';S.view=NAV[acc.role][0][0];S.activeThread=null;render()},600);
    return}
  if(k==='register'){
    var em0=g('email'),pw1=String(d.get('pw')||''),nm0=g('name');
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em0)){S.loginErr='Enter a valid email address.';render();return}
    if(S.users.some(function(u){return u.email.toLowerCase()===em0.toLowerCase()})){S.loginErr='An account with this email already exists. Log in with your ID.';render();return}
    var code2='CC-S-'+(S.next.S++);
    S.users.push({id:nid(),code:code2,pw:pw1,name:nm0,email:em0,role:'Student',on:true});
    S.loginErr='';S.created={code:code2,name:nm0};render();return}
  if(false){
    var em=g('email'),pw=g('pw');
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){S.loginErr='Enter a valid email address.';render();return}
    if(pw.length<4){S.loginErr='Password must be at least 4 characters.';render();return}
    S.loginErr='';S.verifying=true;render();
    setTimeout(function(){S.verifying=false;
      if(k==='register'){var nm=g('name');S.users.push({id:nid(),name:nm,email:em,role:'Student',on:true});S.user={name:nm,email:em,role:'Student',dept:'',phone:''};toast('Account created. Welcome, '+nm.split(' ')[0])}
      else{var r=S.loginRole,known=S.users.filter(function(u){return u.email.toLowerCase()===em.toLowerCase()})[0];
        S.user=known&&known.role===r?{name:known.name,email:em,role:r,dept:r==='Faculty'?'Computer Science':'',phone:''}:{name:r==='Admin'?'Registrar Office':em.split('@')[0].replace(/[._]/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase()}),email:em,role:r,dept:'',phone:''}}
      S.view=NAV[S.user.role][0][0];S.activeThread=null;render()},700);
  }
  else if(k==='postAnn'){S.anns.unshift({id:nid(),title:g('title'),body:g('body'),by:S.user.name,aud:g('aud'),when:'Just now',own:true});S.annForm=false;render();toast('Announcement posted')}
  else if(k==='send'){var T=threads(),t=T.filter(function(x){return x.id===S.activeThread})[0]||T[0],txt=g('text');if(!t||!txt)return;t.msgs.push({me:true,t:txt,w:'Just now'});render();
    var tid=t.id,rl=role();setTimeout(function(){var th=S.threads[rl].filter(function(x){return x.id===tid})[0];if(th){th.msgs.push({me:false,t:'Thanks, I will check and get back to you. (sample auto-reply)',w:'Just now'});if(S.view==='messages')render()}},1300)}
  else if(k==='addEv'){var dt=new Date(g('date')+'T00:00');S.events.push({id:nid(),d:dt.getDate(),m:MON[dt.getMonth()],_s:dt.getTime(),title:g('title'),place:g('place'),time:g('time')});S.events.sort(function(a,b){return (a._s||0)-(b._s||0)});S.evForm=false;render();toast('Event added')}
  else if(k==='profile'){S.user.name=g('name');S.user.dept=g('dept');S.user.phone=g('phone');S.profEdit=false;render();toast('Profile updated')}
  else if(k==='addUser'){var rl2=g('role'),key=rl2==='Faculty'?'F':'S',cd='CC-'+key+'-'+(S.next[key]++),tp=Math.random().toString(36).slice(2,6)+Math.floor(1000+Math.random()*9000);
    S.users.push({id:nid(),code:cd,pw:tp,name:g('name'),email:g('email'),role:rl2,on:true});S.newCred={name:g('name'),code:cd,pw:tp};render()}
  else if(k==='addSub'){var n=g('name');if(n&&SUBJECTS.indexOf(n)<0)SUBJECTS.push(n);render();toast('Subject added')}
  else if(k==='addMat'){S.materials.unshift({id:nid(),title:g('title'),sub:g('sub'),sem:+g('sem'),pages:0,size:'No file',by:'Admin Office'});render();toast('Material added')}
});
render();
})();
</script>
